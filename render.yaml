services:
  - type: web
    name: document-intelligence-platform
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_PATH
        value: /var/data/documents.db
      - key: MAX_FILE_SIZE_MB
        value: "20"
      - key: OCR_LANGUAGE
        value: eng
    disk:
      name: document-intelligence-platform-data
      mountPath: /var/data
      sizeGB: 1