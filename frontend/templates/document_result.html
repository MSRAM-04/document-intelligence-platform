<div class="result-container">
  <div class="result-header">
    <div>
      <h2 id="result-doc-name">Document Result</h2>
      <span id="result-status-badge" class="badge">STATUS</span>
    </div>
    <button id="toggle-json-btn" class="btn secondary-btn">View Raw JSON</button>
  </div>

  <!-- Key Extracted Metrics Grid -->
  <div class="section-title">🎯 Extracted Key Fields</div>
  <div id="fields-grid" class="fields-grid"></div>

  <!-- Line Items Table (if any) -->
  <div id="line-items-section" class="line-items-section hidden">
    <div class="section-title">📋 Document Tables / Line Items</div>
    <div class="table-wrapper">
      <table id="line-items-table" class="data-table">
        <thead>
          <tr>
            <th>Description</th>
            <th>Quantity</th>
            <th>Unit Price</th>
            <th>Amount</th>
          </tr>
        </thead>
        <tbody id="line-items-body"></tbody>
      </table>
    </div>
  </div>

  <!-- Financial Validation Checks -->
  <div class="section-title">🧮 Financial Calculation Validation</div>
  <div id="validation-checks-list" class="validation-list"></div>

  <!-- Raw JSON View -->
  <pre id="json-viewer" class="json-viewer hidden"></pre>
</div>
